<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Esquina Borracha FC</title><style>
:root{font-family:system-ui,Arial;background:#0b111a;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#111e2b;border-bottom:1px solid #314355;padding:14px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:16px;flex-wrap:wrap}header img{width:62px;height:70px;object-fit:contain}h1{font-size:22px;margin:0}small,.muted{color:#a8bbcb}nav{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button,input,select{font:inherit}button{background:#20364a;color:white;border:1px solid #395269;border-radius:9px;padding:10px 13px;cursor:pointer}button:hover,.active{background:#2b607b}main{max-width:1100px;margin:auto;padding:22px 16px 65px}h2{color:#d7b77a}h3{margin:5px 0 12px}.hero{display:flex;align-items:center;gap:25px;background:linear-gradient(125deg,#152b3b,#0d1720);border:1px solid #345064;border-radius:18px;padding:26px;margin-bottom:24px}.hero img{width:135px;max-width:35%;object-fit:contain}.hero p{color:#afc9d7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.card{background:#172431;border:1px solid #304356;border-radius:13px;padding:16px;margin:10px 0}.number{font-size:30px;color:#87d2f1;font-weight:750}.pill{display:inline-block;color:#e9cb7d;background:#3c3629;border-radius:15px;padding:4px 9px;font-size:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #314050}th{color:#93d7f5}input,select{padding:11px;background:#0d1924;color:white;border:1px solid #3a5265;border-radius:8px;max-width:100%;width:100%}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hidden{display:none}.note{color:#e7bd78}.danger{color:#f59c9c}footer{padding:30px;text-align:center;color:#9aafc0}@media(max-width:600px){.hero{padding:15px;gap:12px}.hero img{width:95px}h1{font-size:18px}nav{margin-left:0}}
</style></head><body><header><img src="escudo.jpg" alt="Escudo de La Esquina Borracha FC"><div><h1>LA ESQUINA BORRACHA FC</h1><small>Desde 2022 · Pasión por el fútbol</small></div><nav id="nav"></nav></header><main id="app"></main><footer>La Esquina Borracha FC · Archivo histórico desde 2022</footer><script>
const initial=[['Pablo Hernán Martínez','Pola','17'],['Sebastián Andrés Martínez','','23'],['Lucas Cabral','Lukas','11'],['Mauro Gabriel Aguilera','','39'],['Rodrigo Amarillo','Rayo','24'],['Enzo Paladea','','7'],['Emiliano Leandro González','Pipi','26'],['Rodrigo Becerra','Kakashi','30'],['Ignacio Agustín Carrizo','Carri','10'],['Nelson Tejeda','','3'],['Matías Gabriel Villalba','Pachorra','20'],['Axel Soria','','63'],['Fernando Sandoval','','5'],['Maximiliano Galeano','','77'],['Luis Guillermo Tejeda','Tero','15'],['Fernando Cáceres','','4'],['Rodrigo Jesús García','Rodry G','97'],['Gonzalo Marcos García','Gonza G','47'],['Adrián Pablo Martínez','Adry','27'],['Jonathan Silveira','Mole','47'],['Cristian Nicolás Santillán','','23'],['Gabriel','Gaby',''],['Nicolás Esteban Gutiérrez','',''],['Mario Rojas','','9'],['Ale Sandoval','Chango','']].map((x,i)=>({id:i+1,name:x[0],alias:x[1],number:x[2],ta:x[0]==='Mario Rojas'?6:x[0]==='Ale Sandoval'?0:null,tr:x[0]==='Mario Rojas'?2:x[0]==='Ale Sandoval'?0:null,goals:null,status:'Actual'}));
const initialFormer=['Fabrizio Nicolás Debenedetti','Santiago González','Gabriel Rojas','Lucas Gamarra','Lucas Ezequiel Lemos','Agustín Demichelis','Agustín Pogonza','Ezequiel Toneghin','Tobías Ramírez','Rodrigo Amodey','Nahuel Ale','Elías Higa González','Cristian Amarillo','Cristian Caldini','Facundo Fornasari','Nicolás Ezequiel Valles','Damián Alejandro Gauna','Daniel Giménez','Brahian'].map((name,i)=>({id:i+101,name,alias:name==='Rodrigo Amodey'?'Rulito':name==='Fabrizio Nicolás Debenedetti'?'Fabri':'',number:'',ta:name==='Brahian'?3:name==='Daniel Giménez'?0:null,tr:name==='Brahian'||name==='Daniel Giménez'?0:null,goals:null,status:'Exjugador'}));
const load=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};let players=load('leb_players_v1',[...initial,...initialFormer]),matches=load('leb_matches_v1',[]),page='inicio';const save=()=>{localStorage.setItem('leb_players_v1',JSON.stringify(players));localStorage.setItem('leb_matches_v1',JSON.stringify(matches))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=document.getElementById('app');const btns=[['inicio','Inicio'],['plantel','Plantel'],['goles','Goleadores'],['partidos','Partidos'],['titulos','Títulos'],['admin','Administrar']];function go(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=btns.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('');if(page==='inicio'){el.innerHTML=`<section class="hero"><img src="escudo.jpg" alt="Escudo oficial"><div><span class="pill">FUNDADO EN 2022</span><h2>La Esquina Borracha FC</h2><p>El hogar de nuestro plantel, partidos, estadísticas y títulos. Toda nuestra historia en un solo lugar.</p></div></section><div class="grid">${[['Jugadores actuales',players.filter(x=>x.status==='Actual').length],['Exjugadores',players.filter(x=>x.status==='Exjugador').length],['Partidos cargados',matches.length],['Goles cargados',matches.reduce((a,m)=>a+Number(m.gf),0)]].map(([t,n])=>`<div class="card"><div class="number">${n}</div><small>${t}</small></div>`).join('')}</div><div class="card"><h3>Próximo paso</h3><p>El plantel inicial ya está incorporado. Desde <b>Administrar</b> podés completar tarjetas, goles y resultados. Los totales históricos que aún necesitan revisión quedan pendientes, para evitar estadísticas incorrectas.</p></div>`}
if(page==='plantel'){el.innerHTML=`<h2>Plantel histórico</h2><input id="filter" placeholder="Buscar nombre, apodo o camiseta" oninput="drawPlayers()"><div id="playerlist"></div>`;drawPlayers()}
if(page==='goles'){let ranked=players.filter(x=>x.goals!==null).sort((a,b)=>b.goals-a.goals);el.innerHTML=`<h2>Goleadores históricos</h2><p class="note">Los goles se completan al validar el historial de partidos. No se muestran cifras provisionales como definitivas.</p><div class="card">${ranked.length?`<table><tr><th>Jugador</th><th>Goles registrados</th></tr>${ranked.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.goals}</td></tr>`).join('')}</table>`:'Aún no hay totales individuales validados.'}</div>`}
if(page==='partidos'){el.innerHTML=`<h2>Partidos</h2><p class="muted">Siempre: primer número La Esquina, segundo número el rival.</p>${matches.length?matches.slice().reverse().map(m=>`<div class="card"><small>${esc(m.tournament)} · ${esc(m.date)}</small><h3>La Esquina ${m.gf} – ${m.ga} ${esc(m.rival)}</h3><div class="muted">Goleadores: ${esc(m.scorers||'Sin cargar')} · Arquero: ${esc(m.keeper||'Sin cargar')}</div></div>`).join(''):'<div class="card">Todavía no hay partidos cargados en esta versión. Podés agregarlos desde Administrar.</div>'}`}
if(page==='titulos'){el.innerHTML=`<h2>Palmarés</h2>${['Copa Desafío · Campeones','Copa Bronce Apertura 2023 · Campeones','Apertura 2025 · Campeones','Copa Oro Apertura 2025 · Semifinalistas','Torneo Verano 2025 · 4.º puesto','Clausura 2026 · 4.º puesto'].map(t=>`<div class="card">🏆 ${esc(t)}</div>`).join('')}<p class="muted">Logros extraídos de las anotaciones compartidas; pendientes de revisión final.</p>`}
if(page==='admin'){el.innerHTML=`<h2>Administrar</h2><p class="note">Versión de prueba: los cambios se guardan solamente en este navegador. Todavía NO hay inicio de sesión ni base de datos en línea. No cargues datos sensibles.</p><div class="card"><h3>Agregar partido</h3><form id="matchform" class="form"><input name="date" type="date" required><input name="tournament" placeholder="Torneo" required><input name="rival" placeholder="Rival" required><input name="gf" type="number" min="0" placeholder="Goles La Esquina" required><input name="ga" type="number" min="0" placeholder="Goles rival" required><select name="keeper"><option value="">Arquero (opcional)</option>${players.filter(p=>['Sebastián Andrés Martínez','Jonathan Silveira','Ezequiel Toneghin'].includes(p.name)).map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><input name="scorers" placeholder="Ej: 2 Rodry G 1 Rayo"><button type="submit">Guardar partido</button></form></div><div class="card"><h3>Actualizar jugador</h3><form id="playerform" class="form"><select name="id" required>${players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input name="number" placeholder="Dorsal (vacío = sin cambio)"><input name="alias" placeholder="Apodo (vacío = sin cambio)"><input name="ta" type="number" min="0" placeholder="TA total"><input name="tr" type="number" min="0" placeholder="TR total"><input name="goals" type="number" min="0" placeholder="Goles históricos verificados"><button type="submit">Guardar jugador</button></form></div><div class="card"><h3>Respaldo</h3><button onclick="exportData()">Exportar datos JSON</button><p class="muted">Guardá una copia de seguridad. No borres los datos del navegador antes de exportar.</p></div>`;document.getElementById('matchform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.gf=+x.gf;x.ga=+x.ga;matches.push(x);save();render();alert('Partido guardado en este navegador')};document.getElementById('playerform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),p=players.find(p=>p.id==x.id);for(let k of ['number','alias'])if(x[k]!=='')p[k]=x[k];for(let k of ['ta','tr','goals'])if(x[k]!=='')p[k]=+x[k];save();render();alert('Jugador actualizado en este navegador')}}}
function drawPlayers(){let q=(document.getElementById('filter')?.value||'').toLowerCase();document.getElementById('playerlist').innerHTML=['Actual','Exjugador'].map(status=>`<h3>${status==='Actual'?'Plantel actual':'Exjugadores'}</h3><div class="grid">${players.filter(p=>p.status===status&&[p.name,p.alias,p.number].join(' ').toLowerCase().includes(q)).map(p=>`<div class="card"><div class="number">${esc(p.number||'—')}</div><b>${esc(p.name)}</b><p class="muted">${esc(p.alias||'Sin apodo')}</p><small>TA: ${p.ta??'Pendiente'} · TR: ${p.tr??'Pendiente'} · Goles: ${p.goals??'Pendiente'}</small></div>`).join('')}</div>`).join('')}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify({players,matches,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='la-esquina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}render();
</script></body></html>
