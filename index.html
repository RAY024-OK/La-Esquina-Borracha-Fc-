<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Esquina Borracha FC</title><style>
:root{font-family:system-ui,Arial;background:#0b111a;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#111e2b;border-bottom:1px solid #314355;padding:14px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:16px;flex-wrap:wrap}header img{width:62px;height:70px;object-fit:contain}h1{font-size:22px;margin:0}small,.muted{color:#a8bbcb}nav{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button,input,select{font:inherit}button{background:#20364a;color:white;border:1px solid #395269;border-radius:9px;padding:10px 13px;cursor:pointer}button:hover,.active{background:#2b607b}main{max-width:1100px;margin:auto;padding:22px 16px 65px}h2{color:#d7b77a}h3{margin:5px 0 12px}.hero{display:flex;align-items:center;gap:25px;background:linear-gradient(125deg,#152b3b,#0d1720);border:1px solid #345064;border-radius:18px;padding:26px;margin-bottom:24px}.hero img{width:135px;max-width:35%;object-fit:contain}.hero p{color:#afc9d7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.card{background:#172431;border:1px solid #304356;border-radius:13px;padding:16px;margin:10px 0}.number{font-size:30px;color:#87d2f1;font-weight:750}.pill{display:inline-block;color:#e9cb7d;background:#3c3629;border-radius:15px;padding:4px 9px;font-size:12px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #314050}th{color:#93d7f5}input,select{padding:11px;background:#0d1924;color:white;border:1px solid #3a5265;border-radius:8px;max-width:100%;width:100%}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hidden{display:none}.note{color:#e7bd78}.danger{color:#f59c9c}footer{padding:30px;text-align:center;color:#9aafc0}@media(max-width:600px){.hero{padding:15px;gap:12px}.hero img{width:95px}h1{font-size:18px}nav{margin-left:0}}

.status{padding:10px 13px;border-radius:9px;background:#20364a;margin:12px 0}.ok{color:#a9ebbc}.error{color:#ffb1b1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.wide{grid-column:1/-1}.card h3{color:#e9cb7d}.scroll{overflow-x:auto}button:disabled{opacity:.55;cursor:wait}label{font-size:13px;color:#a8bbcb}textarea{font:inherit;background:#0d1924;color:white;border:1px solid #3a5265;border-radius:8px;padding:10px;width:100%} .subtle{font-size:13px;color:#a8bbcb} .form > div{min-width:0} .form label{display:block;margin-bottom:4px} .form input,.form select{margin-top:4px} .rowbuttons{display:flex;gap:8px;flex-wrap:wrap} .hero h2{margin:9px 0} .number{word-break:break-word}
</style></head><body><header><img src="escudo.jpg" alt="Escudo de La Esquina Borracha FC"><div><h1>LA ESQUINA BORRACHA FC</h1><small>Desde 2022 · Pasión por el fútbol</small></div><nav id="nav"></nav></header><main id="app"><p>Cargando datos del club...</p></main><footer>La Esquina Borracha FC · Archivo histórico desde 2022</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const SUPABASE_URL='https://kasvfxcdgwltoeauokeo.supabase.co';
const SUPABASE_KEY='sb_publishable_Qlg8fv7J-gAaE-RJkrmnTw_FKwbzIDu';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const el=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('es-AR'):'Sin fecha';
const number=x=>Number.isFinite(Number(x))?Number(x):0;
let page='inicio',players=[],matches=[],goals=[],cards=[],keepers=[],tournaments=[],titles=[],user=null,isAdmin=false,loadError='',message='';
const pages=[['inicio','Inicio'],['plantel','Plantel'],['goles','Goleadores'],['partidos','Partidos'],['titulos','Títulos'],['admin','Administrar']];
const pName=id=>players.find(p=>String(p.id)===String(id))?.nombre||'Jugador no disponible';
const tName=id=>tournaments.find(t=>String(t.id)===String(id))?.nombre||'Sin torneo';
const options=(items,label,placeholder='Seleccionar')=>`<option value="">${esc(placeholder)}</option>${items.map(x=>`<option value="${esc(x.id)}">${esc(label(x))}</option>`).join('')}`;
function go(p){page=p;message='';render();}
function status(msg,err=false){message=`<div class="status ${err?'error':'ok'}">${esc(msg)}</div>`;render();}
async function query(table,columns='*',order='id.asc'){
 let q=db.from(table).select(columns);if(order){const [col,dir]=order.split('.');q=q.order(col,{ascending:dir!=='desc'});}const {data,error}=await q;if(error)throw new Error(`${table}: ${error.message}`);return data||[];
}
async function refresh(){
 if(!db){loadError='No se pudo cargar la conexión a Supabase. Revisá la conexión a Internet.';render();return;}
 try{
  const [p,m,g,c,k,t,ti]=await Promise.all([query('jugadores','*','nombre.asc'),query('partidos','*','fecha.desc'),query('goles'),query('tarjetas'),query('arqueros_partidos','*','partido_id.asc'),query('torneos'),query('titulos')]);
  players=p;matches=m;goals=g;cards=c;keepers=k;tournaments=t;titles=ti;loadError='';
 }catch(e){loadError='No se pudieron cargar todos los datos: '+e.message;}
 render();
}
async function init(){if(!db){await refresh();return;}const {data:{session}}=await db.auth.getSession();user=session?.user||null;await checkAdmin();await refresh();db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(async()=>{await checkAdmin();render()},0)});}
async function checkAdmin(){isAdmin=false;if(!user)return;const {data,error}=await db.rpc('es_admin');if(!error)isAdmin=data===true;}
function render(){document.getElementById('nav').innerHTML=pages.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');
 let out=loadError?`<div class="status error">${esc(loadError)}</div>`:'';out+=message;
 if(page==='inicio')out+=home();if(page==='plantel')out+=plantel();if(page==='goles')out+=goleadores();if(page==='partidos')out+=partidos();if(page==='titulos')out+=palmares();if(page==='admin')out+=admin();el.innerHTML=out;if(page==='plantel')drawPlayers();
}
function home(){let active=players.filter(p=>p.activo).length;return `<section class="hero"><img src="escudo.jpg" alt="Escudo oficial"><div><span class="pill">FUNDADO EN 2022</span><h2>La Esquina Borracha FC</h2><p>El hogar de nuestro plantel, partidos, estadísticas y títulos. Toda nuestra historia en un solo lugar.</p></div></section><div class="grid">${[['Jugadores actuales',active],['Exjugadores',players.length-active],['Partidos cargados',matches.length],['Goles en partidos',matches.reduce((s,m)=>s+number(m.goles_favor),0)]].map(([a,b])=>`<div class="card"><div class="number">${b}</div><small>${a}</small></div>`).join('')}</div><div class="card"><h3>Estadísticas del club</h3><p>Los datos se consultan directamente desde Supabase. Los goles y tarjetas individuales se muestran según los registros cargados.</p></div>`;}
function playerStats(id){return {g:goals.filter(x=>String(x.jugador_id)===String(id)).reduce((s,x)=>s+number(x.cantidad),0),y:cards.filter(x=>String(x.jugador_id)===String(id)).reduce((s,x)=>s+number(x.amarillas),0),r:cards.filter(x=>String(x.jugador_id)===String(id)).reduce((s,x)=>s+number(x.rojas),0)};}
function plantel(){return `<h2>Plantel histórico</h2><input id="filter" placeholder="Buscar nombre, apodo o camiseta" oninput="drawPlayers()"><div id="playerlist"></div>`;}
function drawPlayers(){const dest=document.getElementById('playerlist');if(!dest)return;let q=(document.getElementById('filter')?.value||'').toLowerCase();dest.innerHTML=[true,false].map(active=>`<h3>${active?'Plantel actual':'Exjugadores'}</h3><div class="grid">${players.filter(p=>p.activo===active&&[p.nombre,p.apodo,p.dorsal].join(' ').toLowerCase().includes(q)).map(p=>{let s=playerStats(p.id);return `<div class="card"><div class="number">${esc(p.dorsal??'—')}</div><b>${esc(p.nombre)}</b><p class="muted">${esc(p.apodo||'Sin apodo')}</p><small>TA: ${s.y} · TR: ${s.r} · Goles: ${s.g}</small></div>`}).join('')||'<p class="muted">No hay jugadores en esta categoría.</p>'}</div>`).join('');}
function goleadores(){const rows=players.map(p=>({...p,...playerStats(p.id)})).filter(p=>p.g>0).sort((a,b)=>b.g-a.g);return `<h2>Goleadores históricos</h2><p class="note">Solo se cuentan goles registrados individualmente en Supabase; el historial puede estar incompleto.</p><div class="card scroll">${rows.length?`<table><tr><th>Jugador</th><th>Goles</th></tr>${rows.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${p.g}</td></tr>`).join('')}</table>`:'Todavía no hay goles individuales registrados.'}</div>`;}
function partidos(){return `<h2>Partidos</h2><p class="muted">Primer número: La Esquina. Segundo número: el rival.</p>${matches.map(m=>{let scorers=goals.filter(g=>String(g.partido_id)===String(m.id));let keeper=keepers.find(k=>String(k.partido_id)===String(m.id));return `<div class="card"><small>${esc(tName(m.torneo_id))} · ${fmt(m.fecha)}</small><h3>La Esquina ${number(m.goles_favor)} – ${number(m.goles_contra)} ${esc(m.rival)}</h3><p class="muted">Goleadores: ${scorers.length?scorers.map(g=>`${esc(pName(g.jugador_id))} (${number(g.cantidad)})`).join(', '):'Sin registrar'}</p><p class="muted">Arquero: ${keeper?esc(pName(keeper.arquero_id))+' · Goles recibidos: '+number(keeper.goles_recibidos):'Sin registrar'}</p></div>`}).join('')||'<div class="card">Todavía no hay partidos registrados en Supabase.</div>'}`;}
function palmares(){return `<h2>Palmarés</h2>${titles.length?titles.map(t=>`<div class="card">🏆 <b>${esc(t.nombre)}</b>${t.anio?' · '+esc(t.anio):''}${t.puesto?' · '+esc(t.puesto):''}${t.descripcion?`<p class="muted">${esc(t.descripcion)}</p>`:''}</div>`).join(''):'<div class="card">Todavía no hay títulos registrados en Supabase.</div>'}`;}
function admin(){if(!user)return `<h2>Administración privada</h2><div class="card"><h3>Ingresar como administrador</h3><p class="muted">Solo tu cuenta autorizada puede modificar los datos.</p><form class="form" onsubmit="login(event)"><input name="email" type="email" autocomplete="username" placeholder="Correo electrónico" required><input name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required><button type="submit">Iniciar sesión</button></form></div>`;
 if(!isAdmin)return `<h2>Administración privada</h2><div class="card"><p>Sesión iniciada como <b>${esc(user.email)}</b>, pero esta cuenta no tiene permisos de administrador.</p><button onclick="logout()">Cerrar sesión</button></div>`;
 const po=options(players,p=>`${p.nombre}${p.apodo?' ('+p.apodo+')':''}`,'Elegir jugador');const mo=options(matches,m=>`${fmt(m.fecha)} · ${m.rival}`,'Elegir partido');const to=options(tournaments,t=>t.nombre,'Sin torneo');
 return `<h2>Panel de administración</h2><div class="card toolbar"><span>Sesión: <b>${esc(user.email)}</b></span><button onclick="logout()">Cerrar sesión</button><button onclick="refresh()">Actualizar datos</button></div>
 <div class="card"><h3>Agregar jugador</h3><form class="form" onsubmit="addPlayer(event)"><input name="nombre" placeholder="Nombre completo" required><input name="apodo" placeholder="Apodo (opcional)"><input name="dorsal" type="number" min="0" placeholder="Dorsal"><input name="posicion" placeholder="Posición (opcional)"><select name="activo"><option value="true">Jugador actual</option><option value="false">Exjugador</option></select><button type="submit">Agregar jugador</button></form></div>
 <div class="card"><h3>Modificar jugador</h3><form class="form" onsubmit="updatePlayer(event)"><select name="id" required>${po}</select><input name="nombre" placeholder="Nuevo nombre (opcional)"><input name="apodo" placeholder="Nuevo apodo (opcional)"><input name="dorsal" type="number" min="0" placeholder="Nuevo dorsal (opcional)"><select name="activo"><option value="">No cambiar estado</option><option value="true">Actual</option><option value="false">Exjugador</option></select><button type="submit">Guardar cambios</button></form><p class="subtle">Los campos vacíos no se modifican.</p></div>
 <div class="card"><h3>Agregar torneo</h3><form class="form" onsubmit="addTournament(event)"><input name="nombre" placeholder="Nombre del torneo" required><input name="temporada" placeholder="Temporada (opcional)"><button type="submit">Guardar torneo</button></form></div>
 <div class="card"><h3>Agregar partido</h3><form class="form" onsubmit="addMatch(event)"><input name="fecha" type="date" required><select name="torneo_id">${to}</select><input name="rival" placeholder="Rival" required><input name="goles_favor" type="number" min="0" placeholder="Goles La Esquina" required><input name="goles_contra" type="number" min="0" placeholder="Goles rival" required><input name="observaciones" placeholder="Observaciones (opcional)"><button type="submit">Guardar partido</button></form></div>
 <div class="card"><h3>Registrar goles individuales</h3><form class="form" onsubmit="addGoals(event)"><select name="partido_id" required>${mo}</select><select name="jugador_id" required>${po}</select><input name="cantidad" type="number" min="1" value="1" required><button type="submit">Registrar goles</button></form><p class="subtle">Cargá cada goleador por separado. Esto no suma goles al resultado del partido, solo identifica quién los hizo.</p></div>
 <div class="card"><h3>Registrar tarjetas</h3><form class="form" onsubmit="addCards(event)"><select name="partido_id">${mo}</select><select name="jugador_id" required>${po}</select><input name="amarillas" type="number" min="0" value="0" placeholder="Amarillas"><input name="rojas" type="number" min="0" value="0" placeholder="Rojas"><input name="observaciones" placeholder="Observaciones (opcional)"><button type="submit">Guardar tarjetas</button></form></div>
 <div class="card"><h3>Registrar arquero del partido</h3><form class="form" onsubmit="addKeeper(event)"><select name="partido_id" required>${mo}</select><select name="arquero_id" required>${po}</select><input name="goles_recibidos" type="number" min="0" placeholder="Goles recibidos" required><button type="submit">Guardar arquero</button></form></div>
 <div class="card"><h3>Agregar título o logro</h3><form class="form" onsubmit="addTitle(event)"><input name="nombre" placeholder="Nombre del título o torneo" required><input name="anio" type="number" min="2022" max="2100" placeholder="Año"><input name="puesto" placeholder="Puesto / resultado"><input name="descripcion" placeholder="Descripción (opcional)"><button type="submit">Guardar logro</button></form></div>
 <div class="card"><h3>Respaldo de datos</h3><button onclick="backup()">Exportar datos JSON</button><p class="subtle">Guarda una copia de los datos públicos descargados desde Supabase.</p></div>`;
}
async function login(e){e.preventDefault();const f=new FormData(e.target);const {data,error}=await db.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)return status('No se pudo iniciar sesión: '+error.message,true);user=data.user;await checkAdmin();status(isAdmin?'Sesión de administrador iniciada.':'La cuenta ingresó, pero no tiene permisos de administrador.',!isAdmin);}
async function logout(){const {error}=await db.auth.signOut();if(error)return status(error.message,true);user=null;isAdmin=false;status('Sesión cerrada.');}
async function write(table,payload,upsert=false){if(!isAdmin)return status('No tenés permisos de administrador.',true);const res=upsert?await db.from(table).upsert(payload,{onConflict:'partido_id'}):await db.from(table).insert(payload);if(res.error)return status('No se pudo guardar: '+res.error.message,true);message='<div class="status ok">Datos guardados correctamente en Supabase.</div>';await refresh();}
const v=(f,key)=>String(f.get(key)??'').trim();
const nullable=(f,key)=>v(f,key)||null;
async function addPlayer(e){e.preventDefault();const f=new FormData(e.target);await write('jugadores',{nombre:v(f,'nombre'),apodo:nullable(f,'apodo'),dorsal:v(f,'dorsal')===''?null:Number(v(f,'dorsal')),posicion:nullable(f,'posicion'),activo:v(f,'activo')==='true'});}
async function updatePlayer(e){e.preventDefault();const f=new FormData(e.target),id=v(f,'id');if(!id)return status('Elegí un jugador.',true);const update={};for(const k of ['nombre','apodo'])if(v(f,k))update[k]=v(f,k);if(v(f,'dorsal'))update.dorsal=Number(v(f,'dorsal'));if(v(f,'activo'))update.activo=v(f,'activo')==='true';if(!Object.keys(update).length)return status('Completá algún campo para modificar.',true);const {error}=await db.from('jugadores').update(update).eq('id',id);if(error)return status('No se pudo modificar: '+error.message,true);message='<div class="status ok">Jugador actualizado.</div>';await refresh();}
async function addTournament(e){e.preventDefault();const f=new FormData(e.target);await write('torneos',{nombre:v(f,'nombre'),temporada:nullable(f,'temporada')});}
async function addMatch(e){e.preventDefault();const f=new FormData(e.target);await write('partidos',{fecha:v(f,'fecha'),torneo_id:v(f,'torneo_id')?Number(v(f,'torneo_id')):null,rival:v(f,'rival'),goles_favor:Number(v(f,'goles_favor')),goles_contra:Number(v(f,'goles_contra')),observaciones:nullable(f,'observaciones')});}
async function addGoals(e){e.preventDefault();const f=new FormData(e.target);await write('goles',{partido_id:Number(v(f,'partido_id')),jugador_id:Number(v(f,'jugador_id')),cantidad:Number(v(f,'cantidad'))});}
async function addCards(e){e.preventDefault();const f=new FormData(e.target);await write('tarjetas',{partido_id:v(f,'partido_id')?Number(v(f,'partido_id')):null,jugador_id:Number(v(f,'jugador_id')),amarillas:Number(v(f,'amarillas')||0),rojas:Number(v(f,'rojas')||0),observaciones:nullable(f,'observaciones')});}
async function addKeeper(e){e.preventDefault();const f=new FormData(e.target);await write('arqueros_partidos',{partido_id:Number(v(f,'partido_id')),arquero_id:Number(v(f,'arquero_id')),goles_recibidos:Number(v(f,'goles_recibidos'))},true);}
async function addTitle(e){e.preventDefault();const f=new FormData(e.target);await write('titulos',{nombre:v(f,'nombre'),anio:v(f,'anio')?Number(v(f,'anio')):null,puesto:nullable(f,'puesto'),descripcion:nullable(f,'descripcion')});}
function backup(){const data={jugadores:players,partidos:matches,goles,tarjetas:cards,arqueros_partidos:keepers,torneos:tournaments,titulos:titles,exportado_en:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='la-esquina-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
// Keep functions accessible from inline event handlers.
Object.assign(window,{go,drawPlayers,login,logout,refresh,addPlayer,updatePlayer,addTournament,addMatch,addGoals,addCards,addKeeper,addTitle,backup});
init();
</script></body></html>
